<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavelength</title>
  <style>
    @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 400; font-display: swap; src: url('../fonts/InterTight-Regular.ttf') format('truetype'); }
    @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 500; font-display: swap; src: url('../fonts/InterTight-Medium.ttf') format('truetype'); }
    @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 600; font-display: swap; src: url('../fonts/InterTight-SemiBold.ttf') format('truetype'); }
    @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 700; font-display: swap; src: url('../fonts/InterTight-Bold.ttf') format('truetype'); }
    @font-face { font-family: 'Fraunces SuperSoft'; font-style: normal; font-weight: 600; font-display: swap; src: url('../fonts/Fraunces_72pt_SuperSoft-SemiBold.ttf') format('truetype'); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      color: #1A1612;
      background: #FAF6F1;
      font-feature-settings: 'ss01', 'cv11';
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #DDD2C0;
      background: #FFFDFB;
    }
    .header .logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .header .title {
      font-family: 'Fraunces SuperSoft', Georgia, serif;
      font-weight: 600;
      font-size: 17px;
      color: #1A1612;
      letter-spacing: -0.02em;
    }
    .content { padding: 16px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .status.connected {
      background: #EDF2E2;
      border: 1px solid #C4D4A0;
      color: #5F8A3E;
    }
    .status.disconnected {
      background: #FAE3DE;
      border: 1px solid #E8C0B5;
      color: #B8372B;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.green { background: #5F8A3E; }
    .dot.red { background: #B8372B; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 12px;
      font-family: 'Inter Tight', -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 8px;
      transition: background 200ms cubic-bezier(0.2, 0.7, 0.2, 1),
                  box-shadow 200ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .btn-primary {
      background: #D46A3A;
      color: #FFFDFB;
      box-shadow: 0 2px 8px rgba(212, 106, 58, 0.28);
    }
    .btn-primary:hover {
      background: #B8542A;
      box-shadow: 0 4px 12px rgba(212, 106, 58, 0.35);
    }
    .btn-outline {
      background: #FFFDFB;
      color: #B8542A;
      border: 1px solid #F6CEB2;
      text-decoration: none;
    }
    .btn-outline:hover { background: #FDF5F0; }
    .btn-danger {
      background: #FFFDFB;
      color: #B8372B;
      border: 1px solid #E8C0B5;
    }
    .btn-danger:hover { background: #FAE3DE; }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #B8372B 0%, #D46A3A 45%, #EDA324 100%);
      color: #FFFDFB;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .user-details {
      min-width: 0;
    }
    .user-email {
      font-size: 13px;
      color: #5B4F3E;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #E8E0D3;
      text-align: center;
      font-size: 11px;
      color: #A08F75;
      background: #FAF6F1;
    }
    .desc-text {
      font-size: 13px;
      color: #5B4F3E;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    #login-section, #connected-section { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 200 200" width="28" height="28">
      <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B8372B"></stop><stop offset="55%" stop-color="#D46A3A"></stop><stop offset="100%" stop-color="#EDA324"></stop></linearGradient></defs><circle cx="100" cy="100" r="96" fill="url(#g)"></circle>
      <path d="M 44 54 L 76 146 L 108 85 L 128 128 L 156 92" fill="none" stroke="#FFFDFB" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span class="title">Wavelength</span>
  </div>

  <div class="content">
    <div id="login-section">
      <div class="status disconnected">
        <span class="dot red"></span>
        Not connected
      </div>
      <p class="desc-text">
        Sign in to get personality-aware coaching in your Gmail compose window.
      </p>
      <button id="sign-in-btn" class="btn btn-primary">Sign In</button>
    </div>

    <div id="connected-section">
      <div class="status connected">
        <span class="dot green"></span>
        Connected
      </div>
      <div class="user-info">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-details">
          <div id="user-email" class="user-email"></div>
        </div>
      </div>
      <p class="desc-text">
        Wavelength is active! Open a Gmail compose window to see coaching suggestions.
      </p>
      <a href="https://mywavelength.ai/dashboard" target="_blank" class="btn btn-outline">
        Open Dashboard
      </a>
      <button id="sign-out-btn" class="btn btn-danger">Sign Out</button>
    </div>
  </div>

  <div class="footer">
    Wavelength v0.2.0 &mdash; Communication coaching
  </div>

  <script src="popup.js"></script>
</body>
</html>
